name: Déploiement Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8c94210e52e29b4d4ed4c4f743d65431
      - name: Vérification
        run: |
          for path in / /studio /journal /sitemap.xml /api/cloth; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://costume.jbleroy.fr$path")
            echo "$code $path"; [ "$code" = 200 ]
          done
