<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import des tissus · Atelier</title><link rel="stylesheet" href="admin.css"></head><body><main>
<header><a href="studio.html">← Simulateur</a> · <a href="admin-commandes.html">Commandes</a><h1>Import des tissus</h1></header>
<p id="status" role="status">Vérification de l’accès…</p>
<section id="panel" hidden><div class="fields"><label>Fournisseur<input id="supplier" value="Drwoven" maxlength="60" required></label><label>Collection<input id="collection" placeholder="Ex. NO790" maxlength="60" required></label></div>
<label id="drop">Déposer les photos ou un ZIP<input id="files" type="file" accept=".jpg,.jpeg,.png,.webp,.zip" multiple></label>
<p>Vérifie les références et les motifs proposés. Clique sur une photo pour choisir la zone de tissu à appliquer au costume.</p>
<button id="publish" disabled>Publier les tissus</button><div id="rows"></div></section></main><script type="module" src="admin.js"></script></body></html>
